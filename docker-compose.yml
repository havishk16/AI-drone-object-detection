version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: drone_detection_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drone_detection
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drone_detection_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/drone_detection
      UPLOAD_DIR: ./uploads
      MODEL_PATH: ./models/best.onnx
      CONF_THRESHOLD: 0.25
      IOU_THRESHOLD: 0.45
    volumes:
      - ./backend:/app
      - ./backend/models:/app/models
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drone_detection_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  postgres_data:
